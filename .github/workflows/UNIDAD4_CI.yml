name: CI Taller Integracion

on:
  push:
    branches: ["main_unidad4", "master"]
  pull_request:
    branches: ["main_unidad4", "master"]

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Build, unit and integration tests
        working-directory: registraduria
        run: mvn -B clean verify

      - name: Upload JaCoCo report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: registraduria/target/site/jacoco/
